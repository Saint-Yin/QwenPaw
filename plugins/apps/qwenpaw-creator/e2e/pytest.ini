[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    buttons: origin Home/Composer 可见契约、模型密钥边界与项目生命周期
    cutover: 完整 cutover rehearsal 上 canonical View 到 origin Plan/Workbench/Compose 的浏览器验收
    assets: origin 统一资产网格/Inspector、真实媒体与补充资料 multipart
    contract: 唯一 Creator HTTP 契约、无旧 payload fallback 与 idempotency
    security: 路径、跨项目 exact ref、伪造媒体引用与 role 写边界
    pending: 由公开 Creator 流程产生的 PENDING_REVIEW 操作门与 token CAS
    destructive: 会对一次性 release staging 的 Review Group 提交真实决定
    restart: 独立外部 backend 进程的 SIGKILL、持久状态恢复与跨重启幂等回放
    provider: 使用真实文本/VLM provider 的显式高成本 release acceptance
filterwarnings =
    ignore::DeprecationWarning
