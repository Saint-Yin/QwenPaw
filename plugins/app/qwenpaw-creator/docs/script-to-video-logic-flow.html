<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QwenPaw Creator 剧本到视频端到端逻辑 Canvas</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #66758c;
      --paper: #ffffff;
      --soft: #f6f8fb;
      --line: #d9e2ec;
      --blue: #1f6feb;
      --teal: #0f8b8d;
      --green: #1f7a4f;
      --amber: #a45f00;
      --rose: #b42348;
      --violet: #6f42c1;
      --slate: #40516a;
      --shadow: 0 18px 55px rgba(23, 32, 51, 0.12);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #fbfdff;
      line-height: 1.56;
    }
    button, input { font: inherit; }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 34vw);
    }
    .workspace { min-width: 0; padding: 24px clamp(16px, 3vw, 38px) 64px; }
    .detail-panel {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      border-left: 1px solid var(--line);
      background: rgba(255,255,255,0.96);
      box-shadow: -16px 0 45px rgba(23,32,51,0.08);
    }
    .hero {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
      margin-bottom: 16px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--teal);
      letter-spacing: 0;
      text-transform: uppercase;
    }
    h1 {
      margin: 8px 0 6px;
      font-size: clamp(28px, 4vw, 54px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .subtitle {
      max-width: 980px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }
    .canvas-controls,
    .detail-controls {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
    }
    .canvas-controls {
      position: sticky;
      top: 12px;
      z-index: 30;
      width: max-content;
      margin: 12px 12px -48px auto;
    }
    .detail-controls {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 18px 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.72));
      backdrop-filter: blur(12px);
    }
    .tool-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }
    .tool-btn {
      width: 36px;
      height: 36px;
      min-height: 36px;
      border: 1px solid rgba(217,226,236,0.92);
      background: rgba(255,255,255,0.92);
      color: var(--slate);
      padding: 0;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      box-shadow: 0 8px 18px rgba(23,32,51,0.08);
      backdrop-filter: blur(10px);
    }
    .tool-btn .icon {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      color: var(--blue);
      line-height: 1;
    }
    .tool-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .tool-btn:hover {
      border-color: rgba(31,111,235,0.22);
      background: #fff;
      color: var(--blue);
      box-shadow: 0 8px 18px rgba(31,111,235,0.12);
      transform: translateY(-1px);
    }
    .tool-btn:active {
      transform: translateY(0);
      box-shadow: inset 0 1px 4px rgba(23,32,51,0.12);
    }
    .tool-btn:focus-visible {
      outline: 3px solid rgba(31,111,235,0.2);
      outline-offset: 2px;
    }
    .canvas-wrap {
      position: relative;
      height: calc(100vh - 174px);
      min-height: 620px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(rgba(95,116,141,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(95,116,141,0.08) 1px, transparent 1px),
        #fff;
      background-size: 28px 28px;
      box-shadow: var(--shadow);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .canvas-wrap.dragging { cursor: grabbing; }
    .canvas {
      position: relative;
      width: 1960px;
      height: 1280px;
      transform-origin: top left;
    }
    .lane {
      position: absolute;
      left: 18px;
      right: 18px;
      border: 1px dashed rgba(96,112,137,0.36);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.48);
      pointer-events: none;
    }
    .lane b {
      position: absolute;
      left: 12px;
      top: -13px;
      padding: 2px 8px;
      background: #fff;
      color: var(--slate);
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .edges {
      position: absolute;
      inset: 0;
      width: 1960px;
      height: 1280px;
      pointer-events: none;
      z-index: 1;
    }
    .edge-path {
      fill: none;
      stroke: rgba(64,81,106,0.54);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .edge-path.case { stroke: rgba(31,111,235,0.72); }
    .edge-path.api { stroke: rgba(15,139,141,0.68); stroke-dasharray: 8 7; }
    .edge-path.tool { stroke: rgba(31,122,79,0.72); }
    .edge-label {
      position: absolute;
      z-index: 3;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.96);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--slate);
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 6px 14px rgba(23,32,51,0.08);
      display: none;
    }
    .node {
      position: absolute;
      z-index: 2;
      width: 210px;
      min-height: 94px;
      text-align: left;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.98);
      border-radius: var(--radius);
      padding: 12px;
      cursor: pointer;
      user-select: text;
      box-shadow: 0 12px 28px rgba(23,32,51,0.08);
    }
    .node:hover, .node.active {
      border-color: var(--blue);
      box-shadow: 0 16px 40px rgba(31,111,235,0.16);
    }
    .node .tag {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      background: var(--slate);
      margin-bottom: 8px;
    }
    .node.agent .tag { background: var(--blue); }
    .node.data .tag { background: var(--violet); }
    .node.api .tag { background: var(--teal); }
    .node.tool .tag { background: var(--green); }
    .node.guard .tag { background: var(--rose); }
    .node.pipeline .tag { background: var(--amber); }
    .node h3 { margin: 0 0 5px; font-size: 15px; line-height: 1.25; letter-spacing: 0; }
    .node p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.42; }
    .panel-inner { padding: 24px 24px 70px; }
    .empty {
      border: 1px dashed var(--line);
      background: var(--soft);
      border-radius: var(--radius);
      padding: 16px;
      color: var(--muted);
    }
    .kicker { color: var(--teal); font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0; }
    .panel-title { margin: 6px 0 8px; font-size: 26px; line-height: 1.18; letter-spacing: 0; }
    .summary { color: var(--muted); margin: 0 0 14px; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 10px 0 14px;
    }
    code, .pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: #eef4fb;
      color: #26435f;
      border: 1px solid #d6e4f2;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 12px;
    }
    details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      margin: 10px 0;
      overflow: hidden;
    }
    summary {
      cursor: pointer;
      padding: 11px 13px;
      font-weight: 850;
      background: #f7f9fc;
    }
    .detail-body { padding: 12px 13px 14px; }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin: 8px 0;
    }
    table { width: 100%; border-collapse: collapse; min-width: 680px; font-size: 13px; }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      vertical-align: top;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    th { background: #f4f7fb; color: var(--slate); text-align: left; }
    tr:last-child td { border-bottom: 0; }
    pre {
      margin: 8px 0 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      max-height: 470px;
      overflow: auto;
      border: 1px solid #d7e3ef;
      border-radius: var(--radius);
      background: #0f172a;
      color: #e5eefb;
      padding: 13px;
      font-size: 12px;
      line-height: 1.58;
    }
    ul { padding-left: 20px; margin: 8px 0; }
    li { margin: 6px 0; }
    .flow {
      display: grid;
      gap: 8px;
      margin: 8px 0;
    }
    .flow-step {
      border-left: 3px solid var(--blue);
      padding: 8px 10px;
      background: #f7faff;
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .source-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
    }
    .source-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfe;
      padding: 10px;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .source-card b { display: block; margin-bottom: 4px; }
    .warn {
      border-left: 3px solid var(--amber);
      background: #fff8eb;
      padding: 9px 11px;
      border-radius: 0 var(--radius) var(--radius) 0;
      color: #684000;
    }
    @media (max-width: 1180px) {
      .shell { grid-template-columns: 1fr; }
      .detail-panel { position: relative; height: auto; min-height: 420px; border-left: 0; border-top: 1px solid var(--line); }
      .canvas-wrap { height: 68vh; }
      .hero { align-items: flex-start; flex-direction: column; }
      .detail-controls { justify-content: flex-start; padding-left: 18px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="workspace">
      <section class="hero">
        <div>
          <span class="eyebrow">Current code map · 2026-06-29</span>
          <h1>从剧本到视频的端到端自动化逻辑 Canvas</h1>
          <p class="subtitle">当前项目代码逻辑分析：前端单步 API 与 Pipeline 编排两条入口并存；每个 Agent 的完整 System Prompt / User Prompt 模板 / placeholder 来源都可在右侧详情里展开查看。</p>
        </div>
      </section>
      <section class="canvas-wrap" id="canvasFrame" aria-label="script to video logic canvas">
        <div class="canvas-controls" aria-label="Canvas controls">
          <div class="tool-group" aria-label="Zoom controls">
            <button class="tool-btn" id="zoomOut" title="缩小" aria-label="缩小"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M8 11h6"></path><path d="M16.5 16.5 21 21"></path></svg></span></button>
            <button class="tool-btn" id="zoomIn" title="放大" aria-label="放大"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M8 11h6"></path><path d="M11 8v6"></path><path d="M16.5 16.5 21 21"></path></svg></span></button>
            <button class="tool-btn" id="fit" title="看整体" aria-label="看整体"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path><path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path><path d="M9 9h6v6H9z"></path></svg></span></button>
          </div>
        </div>
        <div class="canvas" id="canvas">
          <svg class="edges" id="edges" viewBox="0 0 1960 1280" preserveAspectRatio="none">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(64,81,106,0.62)"></path>
              </marker>
            </defs>
          </svg>
        </div>
      </section>
    </main>
    <aside class="detail-panel">
      <div class="detail-controls" aria-label="Detail controls">
        <div class="tool-group">
          <button class="tool-btn" id="expandAll" title="展开详情" aria-label="展开详情"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8"></path><path d="M8 20h8"></path><path d="m7 9 5 5 5-5"></path></svg></span></button>
          <button class="tool-btn" id="collapseAll" title="折叠详情" aria-label="折叠详情"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8"></path><path d="M8 20h8"></path><path d="m7 15 5-5 5 5"></path></svg></span></button>
        </div>
      </div>
      <div class="panel-inner" id="detail">
        <div class="empty">点击左侧任意节点查看代码逻辑、Agent Prompt、placeholder 来源和信息对象如何变化。</div>
      </div>
    </aside>
  </div>

  <script>
    const W = 1960;
    const H = 1280;
    const NODE_W = 210;
    const NODE_H = 94;

    const prompts = {
      scriptWriterSystem: String.raw`你是一个专业的短剧编剧AI。用户会给你一个主题/风格，你需要生成完整的短剧剧本大纲。

输出要求（严格JSON格式）：
{
  "title": "剧名",
  "synopsis": "整体剧情概要（100-200字）",
  "episodes": [
    {
      "episode_number": 1,
      "title": "分集标题",
      "synopsis": "本集概要",
      "script": "详细剧本内容，包含场景描述、对白、动作指示"
    }
  ],
  "characters": [
    {
      "name": "角色名",
      "description": "角色描述",
      "is_protagonist": true/false
    }
  ],
  "scenes": [
    {
      "name": "场景名",
      "description": "场景描述"
    }
  ]
}

注意：
- 每集时长按用户指定的秒数规划
- 剧本要有画面感，适合视频化呈现
- 只输出JSON，不要包含其他文字`,
      scriptSplitSystem: String.raw`你是一个专业的短剧编剧AI，擅长将完整的故事剧本拆分为多集短剧剧本。

用户会给你一个完整的故事剧本文本，你需要将其合理拆分为多集短剧。

拆分原则：
- 每集应有完整的起承转合，有明确的开场和结尾钩子（cliffhanger）
- 每集时长要符合用户指定的时长范围
- 保持故事逻辑连贯性，不要在关键情节中间断开
- 按照故事发展的自然节奏来分集
- 每集标题要概括本集核心内容

输出要求（严格JSON格式）：
{
  "episodes": [
    {
      "episode_number": 1,
      "title": "分集标题",
      "synopsis": "本集概要（50-100字）",
      "script": "完整的本集剧本内容，包含场景描述、对白、动作指示"
    }
  ],
  "split_rationale": "分集理由说明"
}

注意：
- 剧本内容必须完整保留原文的所有关键信息，不要遗漏
- 可以适当润色过渡段落，确保每集独立可读
- 只输出JSON，不要包含其他文字`,
      styleSystem: String.raw`你是一个专业的影视视觉风格总监AI。你的任务是根据剧本内容和用户的风格偏好，定义整部作品的视觉风格指南。

视觉风格指南是后续所有图片生成提示词的全局约束——每张设定图和分镜图都必须遵循它，确保跨镜头、跨分镜的视觉一致性。

输出要求（严格JSON格式）：
{
  "art_style": "美术风格一句话定义，如：半写实日系动画风，线条清晰，赛璐璐着色",
  "reference_works": [
    {"name": "作品名", "aspect": "参考该作品的哪些方面"}
  ],
  "color_palette": {
    "primary": "主色调描述及色值",
    "secondary": "辅助色描述及色值",
    "accent": "强调色描述及色值",
    "color_script": [
      {"scene_range": "场景/分镜范围", "temperature": "色温", "primary_color": "#色值", "saturation": "饱和度", "mood": "色调倾向"}
    ]
  },
  "lighting_style": "光影风格描述，如：高对比度、强侧光、电影感明暗分割",
  "aspect_ratio": "画面比例，如：16:9",
  "special_effects": "特殊视觉效果描述（如无则为空字符串）",
  "global_style_prefix": "一句话风格摘要，将作为所有图片生成prompt的前缀。需包含美术风格+色彩基调+光影风格的精炼总结"
}

注意：
- global_style_prefix 是最重要的字段，它会被拼接到后续所有图片生成prompt的开头
- global_style_prefix 应该简洁有力，控制在50字以内
- 色彩脚本时间线要根据剧本的情绪走向设计
- 只输出JSON`,
      assetPlanSystem: String.raw`你是一个专业的影视美术指导AI。你的任务是分析剧本内容，梳理出所有需要的视觉资产（角色形象、环境场景、关键道具）。

对于每个资产，你需要列出需要生成的参考图清单。资产在画布中以「锚点图 → 衍生子图」的树形结构呈现，因此 refs_needed 数组的第一项固定为锚点图描述，后续项为衍生图描述。每项对应一张独立的图片。

### 角色资产规则
- **锚点图**（refs_needed 第 1 项）：正面全身形象，白色/简洁背景
  - 只含角色本身的固有属性：身体特征、发型、服饰、配饰、纹身/疤痕等
  - **禁止包含**：手持武器、独立道具（剑/枪/盾/书/手机等）、背景环境、其他角色
- **衍生图**（refs_needed 第 2 项）：只需一1张最关键的衍生图，从以下选择最适合剧情的一种：
  - 3/4侧面全身像（默认推荐，用于视频中多角度一致性）
  - 关键动作姿势（如剧情中有标志性动作）
  - 关键表情（如剧情中有强烈情绪转折）
- 禁止生成超过2张参考图，效率优先

### 场景资产规则
- **锚点图**（refs_needed 第 1 项）：主视角全景底图，**无角色**、干净环境
- **衍生图**（refs_needed 第 2 项）：只需一1张最关键的变体，如不同角度或不同时段
  - 同样保持无角色
- 禁止生成超过2张参考图

### 道具资产规则
- **锚点图**（refs_needed 第 1 项）：正面特写
- **衍生图**（refs_needed 第 2 项起）：多角度/多形态（如有）
- 仅当道具在剧情中起重要作用时才单独列出

输出要求（严格JSON格式）：
{
  "assets": [
    {
      "category": "character",
      "name": "角色名",
      "refs_needed": ["正面全身形象（锚点图）", "3/4侧面", "正侧面", "背面", "微笑表情", "惊讶表情", "战斗站姿"]
    },
    {
      "category": "environment",
      "name": "场景名",
      "refs_needed": ["主视角全景（锚点图）", "夜间氛围", "俯瞰角度"]
    },
    {
      "category": "prop",
      "name": "道具名",
      "refs_needed": ["正面特写（锚点图）", "侧面角度"]
    }
  ]
}

注意：
- 资产名称要与剧本中的名称一致
- refs_needed 第一项必须是锚点图

    function renderCanvas() {
      const canvas = document.getElementById("canvas");
      lanes.forEach(l => {
        const lane = document.createElement("div");
        lane.className = "lane";
        lane.style.top = l.y + "px";

        canvas.appendChild(lane);

        button.dataset.id = n.id;
        button.style.left = n.x + "px";
        button.style.top = n.y + "px";
        button.innerHTML = `<span class="tag">${esc(n.tag)}</span><h3>${esc(n.title)}</h3><p>${esc(n.desc)}</p>`;
        button.addEventListener("click", () => selectNode(n.id, true));
        canvas.appendChild(button);
      });
      renderEdges();
    }

    function center(n) { return { x: n.x + NODE_W / 2, y: n.y + NODE_H / 2 }; }
    function edgePath(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      if (Math.abs(dx) >= Math.abs(dy)) {
        const sx = dx >= 0 ? a.x + NODE_W : a.x;
        const sy = a.y + NODE_H / 2;
        const ex = dx >= 0 ? b.x : b.x + NODE_W;
        const ey = b.y + NODE_H / 2;
        const mid = sx + (ex - sx) * 0.5;
        return { d: `M ${sx} ${sy} C ${mid} ${sy}, ${mid} ${ey}, ${ex} ${ey}`, labelX: (sx + ex) / 2 - 24, labelY: (sy + ey) / 2 - 20 };
      }
      const sx = a.x + NODE_W / 2;
      const sy = dy >= 0 ? a.y + NODE_H : a.y;
      const ex = b.x + NODE_W / 2;
      const ey = dy >= 0 ? b.y : b.y + NODE_H;
      const mid = sy + (ey - sy) * 0.5;
      return { d: `M ${sx} ${sy} C ${sx} ${mid}, ${ex} ${mid}, ${ex} ${ey}`, labelX: (sx + ex) / 2 + 8, labelY: (sy + ey) / 2 - 18 };
    }
    function renderEdges() {
      const svg = document.getElementById("edges");
      edges.forEach(([from, to, cls, label]) => {
        const a = nodes.find(n => n.id === from);
        const b = nodes.find(n => n.id === to);
        const p = edgePath(a, b);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", `edge-path ${cls || ""}`);
        path.setAttribute("d", p.d);
        path.setAttribute("marker-end", "url(#arrow)");
        svg.appendChild(path);
        const lab = document.createElement("div");
        lab.className = "edge-label";
        lab.style.left = Math.max(8, p.labelX) + "px";
        lab.style.top = Math.max(8, p.labelY) + "px";
        lab.textContent = label;
        document.getElementById("canvas").appendChild(lab);
      });
    }

      frame.scrollTo({ left: 0, top: 0, behavior: "smooth" });
    }
    document.getElementById("zoomOut").addEventListener("click", () => setZoom(zoom - 0.12));
    document.getElementById("zoomIn").addEventListener("click", () => setZoom(zoom + 0.12));
    document.getElementById("fit").addEventListener("click", fit);
    document.getElementById("expandAll").addEventListener("click", () => document.querySelectorAll("#detail details").forEach(d => d.open = true));
    document.getElementById("collapseAll").addEventListener("click", () => document.querySelectorAll("#detail details").forEach(d => d.open = false));

    function enableCanvasDrag() {
      const frame = document.getElementById("canvasFrame");
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let startLeft = 0;
      let startTop = 0;
      const shouldIgnoreDrag = (event) => event.target.closest("button, a, input, textarea, select, summary, details");
      const beginDrag = (event, capturePointer = false) => {
        if (event.button !== 0 || shouldIgnoreDrag(event)) return;
        dragging = true;
        startX = event.clientX;
        startY = event.clientY;
        startLeft = frame.scrollLeft;
        startTop = frame.scrollTop;
        frame.classList.add("dragging");
        if (capturePointer) frame.setPointerCapture(event.pointerId);
        event.preventDefault();
      };
      const moveDrag = (event) => {
        if (!dragging) return;
        frame.scrollLeft = startLeft - (event.clientX - startX);
        frame.scrollTop = startTop - (event.clientY - startY);
        event.preventDefault();
      };
      const endDrag = (event, releasePointer = false) => {
        if (!dragging) return;
        dragging = false;
        frame.classList.remove("dragging");
        if (releasePointer && frame.hasPointerCapture(event.pointerId)) frame.releasePointerCapture(event.pointerId);
      };
      frame.addEventListener("pointerdown", (event) => beginDrag(event, true));
      frame.addEventListener("pointermove", moveDrag);
      frame.addEventListener("pointerup", (event) => endDrag(event, true));
      frame.addEventListener("pointercancel", (event) => endDrag(event, true));
      frame.addEventListener("pointerleave", (event) => endDrag(event, true));
      frame.addEventListener("mousedown", (event) => beginDrag(event, false));
      window.addEventListener("mousemove", moveDrag);
      window.addEventListener("mouseup", (event) => endDrag(event, false));
    }

    renderCanvas();
    enableCanvasDrag();
    selectNode("entry");
    requestAnimationFrame(fit);
    window.addEventListener("resize", () => { if (zoom < 0.95) fit(); });
